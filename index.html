<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Kopi Kenangan — Outlet & Menu</title>
<link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><text y='.9em' font-size='90'>☕</text></svg>">
<style>
*{margin:0;padding:0;box-sizing:border-box}
:root{--g1:#1a5632;--g2:#2d8a4e;--bg:#f3f4f6;--card:#fff;--txt:#1f2937;--txt2:#6b7280;--border:#e5e7eb}
body{font-family:'Inter',system-ui,-apple-system,sans-serif;background:var(--bg);color:var(--txt);min-height:100vh}
.hdr{background:linear-gradient(135deg,var(--g1),var(--g2));color:#fff;padding:16px 16px 12px;position:sticky;top:0;z-index:100;backdrop-filter:blur(10px)}
.hdr-top{display:flex;justify-content:space-between;align-items:center}
.hdr h1{font-size:20px;font-weight:700}.hdr .sub{font-size:12px;opacity:.7}
.hdr-loc{background:rgba(255,255,255,.15);border:1px solid rgba(255,255,255,.2);color:#fff;padding:5px 10px;border-radius:8px;font-size:12px;cursor:pointer;transition:.2s}
.hdr-loc:hover{background:rgba(255,255,255,.25)}
.stats{display:flex;gap:16px;margin-top:10px}
.stat{text-align:center;flex:1}.stat-n{font-size:22px;font-weight:700}.stat-l{font-size:10px;opacity:.7;text-transform:uppercase;letter-spacing:.5px}
.sbar{padding:8px 12px;background:var(--card);border-bottom:1px solid var(--border);position:sticky;top:64px;z-index:99;display:flex;gap:6px}
.sbar input{flex:1;padding:9px 12px;border:1px solid var(--border);border-radius:8px;font-size:13px;outline:0;transition:.2s}
.sbar input:focus{border-color:var(--g2);box-shadow:0 0 0 3px rgba(45,138,78,.1)}
.sbar select{padding:9px;border:1px solid var(--border);border-radius:8px;font-size:13px;background:var(--card);cursor:pointer}
.ctn{max-width:800px;margin:0 auto;padding:6px}
.card{background:var(--card);border-radius:12px;margin-bottom:6px;overflow:hidden;box-shadow:0 1px 2px rgba(0,0,0,.05);cursor:pointer;transition:all .15s;border:1px solid transparent}
.card:hover{border-color:var(--g2);box-shadow:0 4px 12px rgba(0,0,0,.08);transform:translateY(-1px)}
.card:active{transform:scale(.99)}
.card-h{display:flex;justify-content:space-between;align-items:flex-start;padding:12px 14px 6px}
.card-n{font-weight:600;font-size:14px;line-height:1.3}.card-c{font-size:11px;color:var(--txt2);margin-top:1px}
.badge{padding:3px 8px;border-radius:20px;font-size:11px;font-weight:600;white-space:nowrap}
.bg{background:#dcfce7;color:#166534}.bc{background:#fee2e2;color:#991b1b}
.card-i{padding:4px 14px 10px;font-size:12px;color:var(--txt2);line-height:1.6}
.card-i .hrs{color:var(--g1);font-weight:600;display:flex;align-items:center;gap:4px}
.card-i .dist{color:var(--g2);font-weight:500}
.brands{display:flex;gap:3px;margin-top:4px;flex-wrap:wrap}
.brands span{background:#f3f4f6;padding:2px 6px;border-radius:8px;font-size:10px;color:var(--txt2)}
.ov{display:none;position:fixed;inset:0;background:rgba(0,0,0,.4);z-index:200;opacity:0;transition:.2s}
.ov.on{display:block;opacity:1}
.mp{position:fixed;bottom:0;left:0;right:0;max-height:85vh;background:var(--card);border-radius:20px 20px 0 0;overflow:hidden;z-index:201;transform:translateY(100%);transition:transform .3s cubic-bezier(.32,.72,0,1)}
.mp.on{transform:translateY(0)}
.mp-h{padding:14px 18px 10px;display:flex;justify-content:space-between;align-items:center;border-bottom:1px solid var(--border)}
.mp-h h2{font-size:17px;font-weight:700}.mp-x{background:0;border:0;font-size:20px;cursor:pointer;color:var(--txt2);padding:4px 8px;border-radius:8px;transition:.15s}
.mp-x:hover{background:var(--bg)}
.mp-c{overflow-y:auto;max-height:calc(85vh - 60px);-webkit-overflow-scrolling:touch}
.mg{padding:8px 16px}
.mg-t{font-size:12px;font-weight:700;color:var(--g1);padding:6px 0 4px;text-transform:uppercase;letter-spacing:.3px}
.mi{display:flex;justify-content:space-between;align-items:center;padding:8px 0;border-bottom:1px solid var(--border)}
.mi:last-child{border:0}
.mi-n{font-size:13px;font-weight:500;line-height:1.3}
.mi-n.so{color:#d1d5db;text-decoration:line-through}
.mi-p{font-size:12px;color:var(--g1);font-weight:700;text-align:right;white-space:nowrap}
.mi-p .orig{text-decoration:line-through;color:var(--txt2);font-weight:400;font-size:11px;display:block}
.promo{font-size:9px;padding:2px 5px;border-radius:4px;background:#fef3c7;color:#92400e;margin-left:4px;font-weight:600}
.ld{text-align:center;padding:40px;color:var(--txt2);font-size:13px}
.ld::after{content:'';display:block;width:24px;height:24px;border:3px solid var(--border);border-top-color:var(--g2);border-radius:50%;animation:spin .8s linear infinite;margin:12px auto 0}
@keyframes spin{to{transform:rotate(360deg)}}
.empty{text-align:center;padding:40px 20px;color:var(--txt2)}
.empty .icon{font-size:48px;margin-bottom:8px}
.cnt{font-size:11px;color:var(--txt2);padding:6px 16px;text-align:center}
@media(max-width:480px){.card-h{padding:10px 12px 4px}.card-i{padding:2px 12px 8px}}
</style>
</head>
<body>
<div class="hdr">
<div class="hdr-top">
<div><h1>☕ Kopi Kenangan</h1><div class="sub">Outlet & Menu Real-Time</div></div>
<button class="hdr-loc" id="locBtn" onclick="getLoc()">📍 Lokasi saya</button>
</div>
<div class="stats">
<div class="stat"><div class="stat-n" id="tot">-</div><div class="stat-l">Total</div></div>
<div class="stat"><div class="stat-n" id="opn" style="color:#86efac">-</div><div class="stat-l">🟢 Buka</div></div>
<div class="stat"><div class="stat-n" id="cls" style="color:#fca5a5">-</div><div class="stat-l">🔴 Tutup</div></div>
</div></div>
<div class="sbar">
<input type="text" id="q" placeholder="🔍 Cari outlet atau menu..." autocomplete="off">
<select id="f"><option value="">Semua</option><option value="1">🟢 Buka</option><option value="0">🔴 Tutup</option></select>
</div>
<div class="ctn" id="list"><div class="ld">Memuat outlets...</div></div>
<div class="ov" id="ov" onclick="cm()"></div>
<div class="mp" id="mp">
<div class="mp-h"><h2 id="mt">Menu</h2><button class="mp-x" onclick="cm()">✕</button></div>
<div class="mp-c" id="mc"><div class="ld">Memuat menu...</div></div>
</div>
<script>
let S=[],userLat=null,userLon=null;
const API=window.location.origin+'/api';
function hav(a,b,c,d){const R=6371,dLat=(c-a)*Math.PI/180,dLon=(d-b)*Math.PI/180,x=Math.sin(dLat/2)**2+Math.cos(a*Math.PI/180)*Math.cos(c*Math.PI/180)*Math.sin(dLon/2)**2;return R*2*Math.atan2(Math.sqrt(x),Math.sqrt(1-x))}
function dist(s){if(!userLat||!userLon||!s.latitude||!s.longitude)return null;return hav(userLat,userLon,parseFloat(s.latitude),parseFloat(s.longitude))}
function fmtDist(km){return km<1?`${Math.round(km*1000)}m`:`${km.toFixed(1)} km`}
function getLoc(){if(!navigator.geolocation){alert('Geolocation tidak didukung');return}document.getElementById('locBtn').textContent='⏳...';navigator.geolocation.getCurrentPosition(p=>{userLat=p.coords.latitude;userLon=p.coords.longitude;document.getElementById('locBtn').textContent=`📍 ${fmtDist(0)}`;fl();document.getElementById('locBtn').onclick=()=>{document.getElementById('locBtn').textContent='📍 Lokasi saya';userLat=userLon=null;fl();document.getElementById('locBtn').onclick=getLoc}},()=>{document.getElementById('locBtn').textContent='📍 Gagal';setTimeout(()=>document.getElementById('locBtn').textContent='📍 Lokasi saya',2000)})}
async function ls(){try{const p=userLat&&userLon?`?lat=${userLat}&lon=${userLon}`:'';const r=await fetch(API+'/stores'+p);const d=await r.json();S=d.stores;document.getElementById('tot').textContent=d.total;document.getElementById('opn').textContent=d.open;document.getElementById('cls').textContent=d.closed;rs(S)}catch(e){document.getElementById('list').innerHTML='<div class="empty"><div class="icon">⚠️</div>Gagal memuat data</div>'}}
function rs(a){const el=document.getElementById('list');if(!a.length){el.innerHTML='<div class="empty"><div class="icon">🔍</div>Tidak ada outlet ditemukan</div>';return}el.innerHTML=a.map(s=>{const b=(s.brand_and_image||[]).map(x=>`<span>${x.brand_name}</span>`).join('');const d=dist(s);return`<div class="card" onclick="om('${s.code}','${(s.name||'').replace(/'/g,"\\'")}')">
<div class="card-h"><div style="flex:1"><div class="card-n">${s.name||'?'}</div><div class="card-c">${s.code}</div></div>
<span class="badge ${s.is_open?'bg':'bc'}">${s.is_open?'🟢 BUKA':'🔴 TUTUP'}</span></div>
<div class="card-i"><div class="hrs">⏰ ${s.open||'?'} - ${s.close||'?'}</div>
<div>📍 ${s.address||''}</div>
${d!==null?`<div class="dist">🗺️ ${fmtDist(d)}</div>`:''}
${b?`<div class="brands">${b}</div>`:''}</div></div>`}).join('')}
function fl(){const q=document.getElementById('q').value.toLowerCase();const f=document.getElementById('f').value;let r=S;if(q)r=r.filter(s=>(s.name+s.code+s.address||'').toLowerCase().includes(q));if(f==='1')r=r.filter(s=>s.is_open);if(f==='0')r=r.filter(s=>!s.is_open);rs(r)}
async function om(c,n){document.getElementById('mt').textContent=n;document.getElementById('mc').innerHTML='<div class="ld">Memuat menu...</div>';document.getElementById('ov').classList.add('on');document.getElementById('mp').classList.add('on');try{const r=await fetch(API+'/menu/'+c);const d=await r.json();if(d.error){document.getElementById('mc').innerHTML=`<div class="ld">${d.error}</div>`;return}let h=`<div class="cnt">${d.available_items}/${d.total_items} items tersedia</div>`;for(const g of d.groups){h+=`<div class="mg"><div class="mg-t">${g.group_name} (${g.products.filter(p=>p.available).length}/${g.products.length})</div>`;for(const p of g.products)h+=`<div class="mi"><div class="mi-n${p.available?'':' so'}">${p.name}${p.available?'':' (Habis)'}</div><div class="mi-p">${p.original_price&&p.original_price!==p.price?`<span class="orig">Rp${p.original_price.toLocaleString()}</span>`:''}Rp${p.price.toLocaleString()}${p.has_promo?'<span class="promo">PROMO</span>':''}</div></div>`;h+='</div>'}document.getElementById('mc').innerHTML=h}catch(e){document.getElementById('mc').innerHTML='<div class="ld">Gagal memuat menu</div>'}}
function cm(){document.getElementById('ov').classList.remove('on');document.getElementById('mp').classList.remove('on')}
let t;document.getElementById('q').addEventListener('input',()=>{clearTimeout(t);t=setTimeout(fl,200)});
document.getElementById('f').addEventListener('change',fl);
ls();setInterval(ls,60000);
</script>
</body>
</html>
